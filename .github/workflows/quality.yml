name: Quality

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          ACTIONLINT_VER="1.7.12"
          ACTIONLINT_SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA}  actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz" actionlint
          sudo mv actionlint /usr/local/bin/actionlint
          rm -f "actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz"

      - name: Run actionlint
        run: actionlint

  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-pr-title.py

  clang-format:
    name: Clang-format (incremental)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install clang-format
        run: |
          if ! command -v git-clang-format >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y clang-format
          fi

      - name: Verify clang-format version
        run: clang-format --version

      - name: Check code formatting
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ./scripts/check-format.sh "$BASE_REF"

  zizmor:
    name: Zizmor security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install zizmor
        run: |
          ZIZMOR_VER="1.32.0"
          ZIZMOR_SHA="bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b"
          curl -sSLO "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VER}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA}  zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf "zizmor-x86_64-unknown-linux-gnu.tar.gz"
          sudo mv zizmor /usr/local/bin/zizmor
          rm -f "zizmor-x86_64-unknown-linux-gnu.tar.gz"

      - name: Run zizmor
        run: zizmor --min-severity medium .

name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Validate release token
        id: token-check
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_PLEASE_TOKEN secret is not configured in this repository. Release Please requires an authenticated token (fine-grained Personal Access Token or GitHub App token) with 'contents: write' and 'pull-requests: write' to create release PRs that trigger the required CI checks on protected branches. Release automation will remain inactive until this secret is configured."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Please
        if: steps.token-check.outputs.has_token == 'true'
        uses: googleapis/release-please-action@d1a8f221d7723166f48a584aebba00ef3f6febec # v4.1.4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build + self-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCYBERPOWER_ENABLE_WARNINGS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install-prefix"

      - name: Build
        run: cmake --build build --config Release

      - name: Protocol self-test
        run: ./build/cpups --self-test

      - name: CTest offline
        run: ctest --test-dir build --output-on-failure

      - name: Install (prefix)
        run: |
          cmake --install build
          test -f install-prefix/include/cyberpower/ups.hpp
          test -f install-prefix/lib/cmake/cyberpower-ups/cyberpower-upsConfig.cmake
          test -f install-prefix/lib/pkgconfig/cyberpower-ups.pc
          test -x install-prefix/bin/cpups

      - name: Downstream CMake consumer
        run: |
          cmake -S tests/consumer-cmake -B consumer-cmake -DCMAKE_PREFIX_PATH="$PWD/install-prefix"
          cmake --build consumer-cmake

      - name: Downstream pkg-config consumer
        run: |
          export PKG_CONFIG_PATH="$PWD/install-prefix/lib/pkgconfig"
          # shellcheck disable=SC2046
          c++ -std=c++17 tests/consumer-pkgconfig/main.cpp $(pkg-config --cflags --libs cyberpower-ups) -o consumer-pkgconfig
          ./consumer-pkgconfig
          # shellcheck disable=SC2046
          cc -c tests/consumer-pkgconfig/main.c $(pkg-config --cflags cyberpower-ups) -o consumer-c-api.o
          # shellcheck disable=SC2046
          c++ consumer-c-api.o $(pkg-config --libs cyberpower-ups) -o consumer-c-api
          ./consumer-c-api

  ubuntu:
    name: Ubuntu build + self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y cmake g++
          fi

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCYBERPOWER_ENABLE_WARNINGS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install-prefix"

      - name: Build
        run: cmake --build build --config Release

      - name: Protocol self-test
        run: ./build/cpups --self-test

      - name: CTest offline
        run: ctest --test-dir build --output-on-failure

      - name: Install and downstream consumers
        run: |
          cmake --install build
          cmake -S tests/consumer-cmake -B consumer-cmake -DCMAKE_PREFIX_PATH="$PWD/install-prefix"
          cmake --build consumer-cmake
          export PKG_CONFIG_PATH="$PWD/install-prefix/lib/pkgconfig"
          # shellcheck disable=SC2046
          c++ -std=c++17 tests/consumer-pkgconfig/main.cpp $(pkg-config --cflags --libs cyberpower-ups) -o consumer-pkgconfig
          ./consumer-pkgconfig
          # shellcheck disable=SC2046
          cc -c tests/consumer-pkgconfig/main.c $(pkg-config --cflags cyberpower-ups) -o consumer-c-api.o
          # shellcheck disable=SC2046
          c++ consumer-c-api.o $(pkg-config --libs cyberpower-ups) -o consumer-c-api
          ./consumer-c-api

  sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          if ! command -v cmake >/dev/null 2>&1 || ! command -v g++ >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y cmake g++
          fi

      - name: Configure with Sanitizers
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCYBERPOWER_ENABLE_WARNINGS=ON -DCYBERPOWER_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build

      - name: Protocol self-test
        run: ./build/cpups --self-test

      - name: CTest offline
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows build + portable tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCYBERPOWER_ENABLE_WARNINGS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Protocol self-test
        run: |
          if (Test-Path .\build\Release\cpups.exe) {
            .\build\Release\cpups.exe --self-test
          } else {
            .\build\cpups.exe --self-test
          }

      - name: CTest offline
        run: ctest --test-dir build --output-on-failure -C Release

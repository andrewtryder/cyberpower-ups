name: Feature Request
description: Propose a new feature, hardware profile, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea or a new CyberPower hardware profile to suggest? Please provide details below.
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Feature or Hardware Profile
      description: What capability or support would you like to see added?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Hardware / Context Information
      description: Relevant UPS models, protocol variants, or operational use cases.

